apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nl-query-agent-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/hymaia/nl-query-agent
    targetRevision: main
    path: helm
    helm:
      values: |
        image:
          tag: "d9af55855cbc3df6fd1a326270a86686596c2c3e"

  destination:
    server: https://kubernetes.default.svc
    namespace: agent

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
