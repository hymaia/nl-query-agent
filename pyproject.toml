[project]
name = "nl-query-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic-settings>=2.14.1",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.47.0",
    "langgraph>=1.2.0",
    "langchain>=1.3.1",
    "langchain-aws>=1.4.7",
    "langchain-community>=0.4.1",
    "boto3>=1.43.9",
    "pyathena>=3.30.1",
    "sqlalchemy>=2.0.49",
    "python-json-logger>=4.1.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest>=9.0.3",
    "httpx>=0.28.1",
    "ruff>=0.15.13",
    "mypy>=2.1.0",
    "python-dotenv>=1.2.2",
    "boto3-stubs>=1.43.9",
    "boto3-stubs[athena,bedrock-runtime,glue]>=1.43.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
