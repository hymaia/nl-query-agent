# generated by terraform from infra/templates/values.yaml.tpl

nameOverride: ""
fullnameOverride: ""

image:
  repository: 662195598891.dkr.ecr.eu-west-1.amazonaws.com/nl-query-agent
  tag: "latest"
  pullPolicy: IfNotPresent

serviceAccount:
  iamRoleArn: "arn:aws:iam::662195598891:role/hyma-mds-nl-query-agent-role"
  automountToken: true
  annotations: {}
  name: "nl-query-agent"

aws:
  region: "eu-west-1"

bedrock:
  modelId: "anthropic.claude-haiku-4-5-20251001-v1:0"
  maxTokens: 4096

glue:
  database: "hymaia_datalake_raw"

athena:
  outputBucket: "s3://raw-athena-results/output"
  workgroup: "hymaia-datalake-agent-workgroup"

app:
  env: "production"
  logLevel: "INFO"

deployment:
  replicaCount: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  annotations: {}
  podAnnotations: {}
  podLabels: {}
  imagePullSecrets: []

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  livenessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3

  readinessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  extraEnv: []
  envFrom: []
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  annotations: {}

ingress:
  enabled: true
  className: "alb"
  hosts:
    - sql-agent.fcussac.app.hymaia.com
  path: /*
  pathType: ImplementationSpecific
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:eu-west-1:662195598891:certificate/ce9e8ffd-1985-499b-999c-341218134e42"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
