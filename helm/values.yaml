# ==============================================================
# values.yaml — NLQ Agent Helm Chart
# FastAPI + Bedrock Claude Sonnet + LangGraph on Kubernetes
# ==============================================================

nameOverride: ""
fullnameOverride: ""

# --------------------------------------------------------------
# Image
# --------------------------------------------------------------
image:
  repository: your-ecr-account.dkr.ecr.eu-west-1.amazonaws.com/nlq-agent
  tag: "latest"
  pullPolicy: IfNotPresent

# --------------------------------------------------------------
# ServiceAccount / IRSA
# --------------------------------------------------------------
serviceAccount:
  iamRoleArn: "arn:aws:iam::<ACCOUNT_ID>:role/<IAM_ROLE_NAME>"
  automountToken: true
  annotations: {}

# --------------------------------------------------------------
# AWS
# --------------------------------------------------------------
aws:
  region: "eu-west-1"

bedrock:
  modelId: "anthropic.claude-sonnet-4-5"
  maxTokens: 4096

glue:
  database: "my_glue_database"

athena:
  outputBucket: "s3://my-athena-results-bucket/prefix/"
  workgroup: "primary"

# --------------------------------------------------------------
# Application
# --------------------------------------------------------------
app:
  env: "production"
  logLevel: "INFO"

# --------------------------------------------------------------
# Deployment
# --------------------------------------------------------------
deployment:
  replicaCount: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  annotations: {}
  podAnnotations: {}
  podLabels: {}
  imagePullSecrets: []

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  livenessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3

  readinessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  # Variables d'env libres
  extraEnv: []
  # - name: MY_VAR
  #   value: "my-value"
  # - name: SECRET_VALUE
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: my-key

  envFrom: []
  # - configMapRef:
  #     name: my-configmap
  # - secretRef:
  #     name: my-secret

  volumeMounts: []
  volumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --------------------------------------------------------------
# Service
# --------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  annotations: {}

# --------------------------------------------------------------
# Ingress
# --------------------------------------------------------------
ingress:
  enabled: true
  className: "alb"
  hosts:
    - "nlq-agent.example.com"
  path: /*
  pathType: ImplementationSpecific
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: "<CERTIFICATE_ARN>"

# --------------------------------------------------------------
# HPA — désactivé par défaut
# --------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
